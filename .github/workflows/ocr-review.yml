name: OCR review
on:
  workflow_call:
    secrets:
      OCR_BOT_TOKEN:
        required: true
      OCR_LLM_TOKEN:
        required: true
permissions:
  contents: read
  checks: write
jobs:
  review:
    name: ${{ vars.OCR_REVIEW_ENGINE == 'pr-agent' && 'PR-Agent review' || 'OCR review' }}
    if: (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && github.repository_owner == 'altinkaya-opensource'
    runs-on: [self-hosted, linux, x64, ocr]
    timeout-minutes: 60
    concurrency:
      group: ocr-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pull_request_number }}
      cancel-in-progress: true
    steps:
      - name: Review the selected PR files as altinkaya-bot
        uses: altinkaya-opensource/altinkaya-open-code-review/ocr@latest
        env:
          OCR_REVIEW_ENGINE: ${{ vars.OCR_REVIEW_ENGINE }}
          OCR_CHECK_TOKEN: ${{ github.token }}
          OCR_BOT_TOKEN: ${{ secrets.OCR_BOT_TOKEN }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_REASONING_EFFORT: ${{ vars.OCR_LLM_REASONING_EFFORT }}
