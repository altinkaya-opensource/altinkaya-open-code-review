name: OCR checks
on:
  push:
    paths:
      - ocr/**
      - .github/workflows/ocr-*.yml
  pull_request:
    paths:
      - ocr/**
      - .github/workflows/ocr-*.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate review decisions and syntax
        run: |
          python3 -m unittest discover -s ocr -p 'test_*.py' -v
          git diff --check
